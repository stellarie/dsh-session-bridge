<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Architecture: an MCP client talks over stdio to dsh-session-bridge-mcp, which calls the session-bridge plugin in the DSH app over loopback HTTP with a bearer token. The plugin writes endpoint.json and the MCP server reads it on every call.">
  <title>dsh-session-bridge architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#e0679a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#9a8aa6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5fa"/><stop offset="1" stop-color="#f3efff"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Noto Sans", "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", system-ui, sans-serif; fill: #3d2f4a; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .t { font-size: 17px; font-weight: 600; }
    .s { font-size: 13px; fill: #7a6a88; }
    .e { font-size: 13px; font-weight: 600; fill: #c2447c; }
    .n { font-size: 12.5px; fill: #7a6a88; }
  </style>
  <rect x="1" y="1" width="898" height="338" rx="22" fill="url(#bg)" stroke="#f0cfe0" stroke-width="2"/>

  <rect x="36" y="70" width="190" height="104" rx="16" fill="#ffffff" stroke="#e0679a" stroke-width="2"/>
  <text x="131" y="115" text-anchor="middle" class="t">MCP 客户端</text>
  <text x="131" y="140" text-anchor="middle" class="s">Claude Code 等</text>

  <rect x="355" y="70" width="190" height="104" rx="16" fill="#ffffff" stroke="#e0679a" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" class="t mono" style="font-size:13.5px">dsh-session-bridge-mcp</text>
  <text x="450" y="140" text-anchor="middle" class="s">stdio MCP 服务器</text>

  <rect x="674" y="52" width="190" height="140" rx="16" fill="#ffffff" stroke="#8b6fd6" stroke-width="2"/>
  <text x="769" y="84" text-anchor="middle" class="t">DSH 应用</text>
  <rect x="690" y="100" width="158" height="74" rx="12" fill="#f3efff" stroke="#8b6fd6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="769" y="130" text-anchor="middle" class="t mono" style="font-size:13px">session-bridge 插件</text>
  <text x="769" y="153" text-anchor="middle" class="s">本包</text>

  <path d="M228 122H352" stroke="#e0679a" stroke-width="2.2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="290" y="106" text-anchor="middle" class="e mono">stdio</text>

  <path d="M547 122H671" stroke="#e0679a" stroke-width="2.2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="609" y="106" text-anchor="middle" class="e">HTTP + 令牌</text>
  <text x="609" y="146" text-anchor="middle" class="n mono">仅限 127.0.0.1</text>

  <rect x="355" y="262" width="190" height="56" rx="14" fill="#fff9e8" stroke="#e8b84a" stroke-width="2"/>
  <text x="450" y="287" text-anchor="middle" class="t mono" style="font-size:14px">endpoint.json</text>
  <text x="450" y="307" text-anchor="middle" class="n">url · 令牌 · pid</text>

  <path d="M450 176V258" stroke="#9a8aa6" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#d)"/>
  <text x="440" y="222" text-anchor="end" class="n">每次调用都读取</text>
  <path d="M769 194V290H548" stroke="#9a8aa6" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#d)"/>
  <text x="781" y="250" text-anchor="start" class="n">写入</text>
</svg>
